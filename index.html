    <style>
      /* CRITICAL CSS: Inlined to prevent 300ms Render Blocking Delay */
      /* Resets & Base */
      body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #FFF2EC; margin: 0; padding: 0; }
      *, ::before, ::after { box-sizing: border-box; }
      
      /* Typography Fallbacks (Prevent Layout Shift) */
      h1, .font-serif { font-family: 'Lora', Georgia, 'Times New Roman', serif; }
      .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

      /* Prevent layout shift for media */
      img, video { max-width: 100%; height: auto; }

      /* Static Hero Layout */
      .static-hero-container {
        min-height: 100vh;
        min-height: 100svh;
        width: 100%;
        display: flex;
        align-items: center;
        position: relative;
        padding-top: 5rem;
        overflow: hidden;
      }
      
      .static-content {
        width: 100%;
        max-width: 1400px;
        margin: 0 auto;
        padding: 0 1.5rem;
        position: relative;
        z-index: 20;
      }

      @media (min-width: 768px) { .static-content { padding: 0 3rem; } }
      @media (min-width: 1024px) { .static-content { padding: 0 5rem; } }

      .static-header-row {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        margin-bottom: 2.5rem;
      }
      
      @media (min-width: 768px) { .static-header-row { flex-direction: row; align-items: center; gap: 1rem; } }

      .static-sub {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.2em;
        color: #1a1a1a;
        text-transform: uppercase;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .static-h1 {
        font-family: 'Lora', Georgia, serif;
        font-size: 3rem;
        line-height: 1.1;
        letter-spacing: -0.04em;
        color: #1a1a1a;
        margin: 0;
        margin-bottom: 2.5rem;
      }

      @media (min-width: 768px) { .static-h1 { font-size: 3.75rem; } }
      @media (min-width: 1024px) { .static-h1 { font-size: 6.5rem; line-height: 0.9; } }

      .static-gold { color: #C5A059; font-style: italic; }
    </style>

    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap" as="style" />
    
    <link 
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap" 
      rel="stylesheet" 
      media="print" 
      onload="this.media='all'"
    >
    
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap" rel="stylesheet">
    </noscript>
  </head>
  <body>
    <div id="root">
      <section class="static-hero-container">
        <div class="static-content">
          <div class="static-header-row">
            <div class="static-sub">
              <span>/</span>
              <span>SYDNEY BUSINESS SYSTEMS</span>
            </div>
          </div>
          <h1 class="static-h1">
            Stop doing<br/>
            <span class="static-gold">everyone's job</span>
          </h1>
        </div>
      </section>
    </div>
    <script type="module" src="/src/index.tsx"></script>
    <!-- HubSpot: load on first interaction or after 8s (off main thread for passive Lighthouse) -->
    <script>
      function loadHubSpot() {
        if (document.getElementById('hs-script-loader')) return;
        ['https://forms-ap1.hscollectedforms.net', 'https://js-ap1.hscollectedforms.net'].forEach(function (href) {
          if (document.querySelector('link[rel="preconnect"][href="' + href + '"]')) return;
          var link = document.createElement('link');
          link.rel = 'preconnect';
          link.href = href;
          link.crossOrigin = '';
          document.head.appendChild(link);
        });
        var script = document.createElement('script');
        script.src = '//js-ap1.hs-scripts.com/442493227.js';
        script.id = 'hs-script-loader';
        script.async = true;
        document.body.appendChild(script);
      }

      // Load on first interaction OR after 8 seconds, whichever comes first
      var loaded = false;
      function triggerHS() {
        if (loaded) return;
        loaded = true;
        loadHubSpot();
      }
      window.addEventListener('scroll', triggerHS, {once: true});
      window.addEventListener('click', triggerHS, {once: true});
      window.addEventListener('touchstart', triggerHS, {once: true});
      window.addEventListener('load', function() {
        setTimeout(triggerHS, 8000);
      });
    </script>
  </body>
</html>
