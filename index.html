<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>SYSBILT | Business Systems</title>
    <meta name="description" content="SYSBILT builds business systems for growing Australian companies." />

    <!-- Social + AI fetcher fallback meta (site-level defaults; PageMeta.tsx overrides per-route on JS clients) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SYSBILT" />
    <meta property="og:url" content="https://sysbilt.com/" />
    <meta property="og:title" content="SYSBILT | Business systems for Australian companies" />
    <meta property="og:description" content="We are a Sydney team that builds the websites, CRMs, automations, AI assistants, and dashboards that take repetitive work off your plate. Stop doing everyone's job." />
    <meta property="og:image" content="https://sysbilt.com/images/og-sysbilt.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_AU" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SYSBILT | Business systems for Australian companies" />
    <meta name="twitter:description" content="We are a Sydney team that builds the websites, CRMs, automations, AI assistants, and dashboards that take repetitive work off your plate. Stop doing everyone's job." />
    <meta name="twitter:image" content="https://sysbilt.com/images/og-sysbilt.png" />

    <link rel="icon" type="image/png" href="/images/sysbilt-icon.png" />
    <link rel="apple-touch-icon" href="/images/sysbilt-icon.png" />

    <style>
      /* CRITICAL CSS: Inlined to prevent 300ms Render Blocking Delay */
      /* Resets & Base */
      body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #FFF2EC; margin: 0; padding: 0; }
      *, ::before, ::after { box-sizing: border-box; }
      
      /* Typography Fallbacks (Prevent Layout Shift) */
      h1, .font-serif { font-family: 'Lora', Georgia, 'Times New Roman', serif; }
      .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

      /* Prevent layout shift for media */
      img, video { max-width: 100%; height: auto; }

      /* Static Hero Layout */
      .static-hero-container {
        min-height: 100vh;
        min-height: 100svh;
        width: 100%;
        display: flex;
        align-items: center;
        position: relative;
        padding-top: 5rem;
        overflow: hidden;
      }
      
      .static-content {
        width: 100%;
        max-width: 1400px;
        margin: 0 auto;
        padding: 0 1.5rem;
        position: relative;
        z-index: 20;
      }

      @media (min-width: 768px) { .static-content { padding: 0 3rem; } }
      @media (min-width: 1024px) { .static-content { padding: 0 5rem; } }

      .static-header-row {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        margin-bottom: 2.5rem;
      }
      
      @media (min-width: 768px) { .static-header-row { flex-direction: row; align-items: center; gap: 1rem; } }

      .static-sub {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.2em;
        color: #1a1a1a;
        text-transform: uppercase;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .static-h1 {
        font-family: 'Lora', Georgia, serif;
        font-size: 3rem;
        line-height: 1.1;
        letter-spacing: -0.04em;
        color: #1a1a1a;
        margin: 0;
        margin-bottom: 2.5rem;
      }

      @media (min-width: 768px) { .static-h1 { font-size: 3.75rem; } }
      @media (min-width: 1024px) { .static-h1 { font-size: 6.5rem; line-height: 0.9; } }

      .static-gold { color: #C5A059; font-style: italic; }
    </style>

    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap" as="style" />
    
    <link 
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap" 
      rel="stylesheet" 
      media="print" 
      onload="this.media='all'"
    >
    
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap" rel="stylesheet">
    </noscript>
  </head>
  <body>
    <div id="root">
      <section class="static-hero-container">
        <div class="static-content">
          <div class="static-header-row">
            <div class="static-sub">
              <span>/</span>
              <span>SYDNEY BUSINESS SYSTEMS</span>
            </div>
          </div>
          <h1 class="static-h1">
            Stop doing<br/>
            <span class="static-gold">everyone's job</span>
          </h1>
        </div>
      </section>
    </div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
