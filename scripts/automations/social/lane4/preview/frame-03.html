<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>SYSBILT blog carousel frame</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@400;500;600;700&display=block" rel="stylesheet">
<!--
  ═══════════════════════════════════════════════════════════════════════
  SYSBILT blog carousel, Lane 4
  1080 x 1350, rendered to PNG by Browserless at deviceScaleFactor 2
  ═══════════════════════════════════════════════════════════════════════

  ONE FILE, NINE LAYOUTS. Render it once per frame with a different body
  class and different tokens. Never edit the stylesheet or the markup.

  BODY CLASS = "frame-quote theme-red len-mid"

    FRAME   frame-hook          always frame 1
            frame-problem
            frame-stat
            frame-consequence
            frame-stakes
            frame-quote
            frame-steps
            frame-actions
            frame-cta           always the last frame

            Only hook and cta are mandatory. Include a conditional frame
            ONLY if the article genuinely supports it. Four strong frames
            beat nine padded ones.

    THEME   theme-dark | theme-cream | theme-red | theme-gold
            Frame 1 is always theme-dark. Vary the rest across the deck so
            it does not read as one flat colour. Do not repeat the same
            theme on two consecutive frames.

    LEN     len-short | len-mid | len-long
            Measured on the plain-text headline with <em> stripped:
              under 28 chars   len-short
              28 to 55         len-mid
              over 55          len-long
            Defaults to len-long if absent.

  TOKENS
  ------
  Shared, on every frame:
    Automation   2 or 3 words. CSS applies uppercase and the leading slash.
    03     zero padded, e.g. 03
    06    zero padded actual frame count, e.g. 06. NEVER hardcode 09.

  Per frame type. Tokens in hidden sections are invisible, so it is safe to
  leave the unused ones unreplaced, but replacing them all is cleaner.

    hook             
    problem        
    stat            
    consequence    
    stakes          
    quote         Automating an inefficient process just makes you inefficient <em>faster</em> PwC · cited in the article
    steps             
    actions          
    cta             

   and Automating an inefficient process just makes you inefficient <em>faster</em> accept ONE inline <em> which renders in the
  accent colour. Escape & < > from the source text FIRST, then add the em
  tags, or the tags get escaped too.

   is optional on the steps frame. Leave it empty and the row
  collapses. Three or four steps only.

   is mandatory on the stat frame and never blank. Every figure
  carries its source. If the article has no attributable number, do not
  use a stat frame at all.

   is the full blog post URL, e.g. sysbilt.com/blog/the-slug
  Never the homepage. It must match the URL in the LinkedIn first comment.

  Frame body copy: do not pitch SYSBILT until the cta frame. The footer
  wordmark SYSBILT is chrome on every frame (company brand). No site URL
  in the footer. No personal byline on frames.

  Display font: Oswald (locked). Alternatives tested: Barlow Condensed,
  Anton, Archivo. Bebas Neue breaks body and list frames.
  ═══════════════════════════════════════════════════════════════════════
-->
<style>
  * { box-sizing: border-box; }

  :root {
    --cream: #FFF2EC;
    --ink: #1A1A1A;
    --crimson: #9A1730;
    --gold: #C5A059;
    --gold-dk: #8B6914;
    --gold-on-dark: #D4A84B;
    --red-on-dark: #FF6B6B;

    --font-display: 'Oswald', 'Arial Narrow', sans-serif;
    --font-body: 'Inter', sans-serif;

    --pad: 80px;
  }

  /* Themes. Accent values are the READABLE variants from the design
     guidelines, not the decorative ones. Do not substitute #C5A059 or
     #9A1730 as text on a dark ground, both fail contrast. */
  body.theme-dark {
    --bg: var(--ink);
    --fg: var(--cream);
    --accent: var(--gold-on-dark);
    --hair: rgba(255, 242, 236, 0.05);
    --line: rgba(255, 242, 236, 0.22);
  }
  body.theme-cream {
    --bg: var(--cream);
    --fg: var(--ink);
    --accent: var(--crimson);
    --hair: rgba(26, 26, 26, 0.05);
    --line: rgba(26, 26, 26, 0.22);
  }
  body.theme-red {
    --bg: var(--crimson);
    --fg: var(--cream);
    --accent: var(--gold-on-dark);
    --hair: rgba(255, 242, 236, 0.06);
    --line: rgba(255, 242, 236, 0.26);
  }
  body.theme-gold {
    --bg: var(--gold);
    --fg: var(--ink);
    --accent: var(--crimson);
    --hair: rgba(26, 26, 26, 0.06);
    --line: rgba(26, 26, 26, 0.26);
  }

  html, body { margin: 0; padding: 0; }

  body {
    width: 1080px;
    height: 1350px;
    position: relative;
    overflow: hidden;
    background: var(--bg, #1A1A1A);
    color: var(--fg, #FFF2EC);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
  }

  /* ── Shared chrome ────────────────────────────────────────────────── */

  .grid {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image:
      linear-gradient(to right, var(--hair) 1px, transparent 1px),
      linear-gradient(to bottom, var(--hair) 1px, transparent 1px);
    background-size: 90px 90px;
  }

  .bracket {
    position: absolute;
    width: 44px;
    height: 44px;
    z-index: 3;
  }
  .bracket::before, .bracket::after {
    content: '';
    position: absolute;
    background: var(--line);
  }
  .bracket::before { width: 44px; height: 2px; }
  .bracket::after  { width: 2px;  height: 44px; }
  .b-tl { top: 48px; left: 48px; }
  .b-tl::before { top: 0; left: 0; } .b-tl::after { top: 0; left: 0; }
  .b-tr { top: 48px; right: 48px; }
  .b-tr::before { top: 0; right: 0; } .b-tr::after { top: 0; right: 0; }
  .b-bl { bottom: 48px; left: 48px; }
  .b-bl::before { bottom: 0; left: 0; } .b-bl::after { bottom: 0; left: 0; }
  .b-br { bottom: 48px; right: 48px; }
  .b-br::before { bottom: 0; right: 0; } .b-br::after { bottom: 0; right: 0; }

  .head, .foot {
    position: absolute;
    left: var(--pad);
    right: var(--pad);
    z-index: 2;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .head { top: var(--pad); }
  .foot { bottom: var(--pad); }

  .kicker {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 20px;
    text-transform: uppercase;
    letter-spacing: 0.24em;
    color: var(--accent);
  }
  .kicker::before { content: '/ '; }

  .marker {
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 20px;
    letter-spacing: 0.16em;
    opacity: 0.55;
    font-variant-numeric: tabular-nums;
  }

  .mark {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 19px;
    text-transform: uppercase;
    letter-spacing: 0.26em;
  }

  /* ── Stage ────────────────────────────────────────────────────────── */

  main {
    position: absolute;
    left: var(--pad);
    right: var(--pad);
    top: 190px;
    bottom: 170px;
    z-index: 2;
  }

  .f { display: none; height: 100%; flex-direction: column; }
  body.frame-hook        .f.hook        { display: flex; }
  body.frame-problem     .f.problem     { display: flex; }
  body.frame-stat        .f.stat        { display: flex; }
  body.frame-consequence .f.consequence { display: flex; }
  body.frame-stakes      .f.stakes      { display: flex; }
  body.frame-quote       .f.quote       { display: flex; }
  body.frame-steps       .f.steps       { display: flex; }
  body.frame-actions     .f.actions     { display: flex; }
  body.frame-cta         .f.cta         { display: flex; }

  /* ── Type ─────────────────────────────────────────────────────────── */

  h1 {
    font-family: var(--font-display);
    font-weight: 700;
    text-transform: uppercase;
    line-height: 0.94;
    letter-spacing: -0.005em;
    margin: 0;
    font-size: 84px;
  }
  h1 em { font-style: normal; font-weight: 700; color: var(--accent); }

  body.len-short h1 { font-size: 126px; }
  body.len-mid   h1 { font-size: 100px; }
  body.len-long  h1 { font-size: 78px; }

  .body {
    font-family: var(--font-body);
    font-weight: 400;
    font-size: 30px;
    line-height: 1.5;
    opacity: 0.86;
    margin: 0;
    max-width: 820px;
  }

  .spacer { flex: 1 1 auto; }

  /* ── Hook ─────────────────────────────────────────────────────────── */

  .chips { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 56px; }
  .chip {
    border: 2px solid var(--line);
    padding: 11px 20px;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 17px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
  }
  .swipe {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 20px;
    text-transform: uppercase;
    letter-spacing: 0.24em;
    color: var(--accent);
    margin-top: 48px;
  }

  /* ── Problem, consequence ─────────────────────────────────────────── */

  .f.problem h1, .f.consequence h1 { margin-bottom: 44px; }

  /* ── Stat ─────────────────────────────────────────────────────────── */

  .figure {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 300px;
    line-height: 0.86;
    letter-spacing: -0.03em;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .figure-label {
    font-family: var(--font-body);
    font-weight: 400;
    font-size: 34px;
    line-height: 1.4;
    margin-top: 36px;
    max-width: 780px;
  }
  .source {
    font-family: var(--font-body);
    font-weight: 400;
    font-size: 19px;
    opacity: 0.55;
    margin-top: 34px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
  }

  /* ── Stakes ───────────────────────────────────────────────────────── */

  .worked {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 56px;
    line-height: 1.18;
    color: var(--accent);
    margin: 40px 0;
    padding-left: 32px;
    border-left: 4px solid var(--accent);
  }

  /* ── Quote ────────────────────────────────────────────────────────── */

  .qmark {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 180px;
    line-height: 0.6;
    color: var(--accent);
    opacity: 0.4;
  }
  .quote-text {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 64px;
    line-height: 1.22;
    margin: 40px 0 0 0;
  }
  .quote-text em { font-style: normal; font-weight: 600; color: var(--accent); }
  .attrib {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 22px;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    opacity: 0.7;
    margin-top: 48px;
  }

  /* ── Steps ────────────────────────────────────────────────────────── */

  .f.steps h1 { margin-bottom: 52px; }
  .step { display: flex; gap: 28px; margin-bottom: 40px; align-items: baseline; }
  .step:last-child { margin-bottom: 0; }
  .step:has(.step-text:empty) { display: none; }
  .step-num {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 46px;
    line-height: 1;
    color: var(--accent);
    flex: 0 0 68px;
    font-variant-numeric: tabular-nums;
  }
  .step-text {
    font-family: var(--font-body);
    font-weight: 400;
    font-size: 29px;
    line-height: 1.45;
  }

  /* ── Actions ──────────────────────────────────────────────────────── */

  .f.actions h1 { margin-bottom: 48px; }
  .cards { display: flex; flex-direction: column; gap: 24px; }
  .card {
    border: 2px solid var(--line);
    padding: 32px 34px;
    display: flex;
    gap: 26px;
    align-items: baseline;
  }
  .card-num {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 34px;
    color: var(--accent);
    flex: 0 0 48px;
    font-variant-numeric: tabular-nums;
  }
  .card-text {
    font-family: var(--font-body);
    font-weight: 400;
    font-size: 27px;
    line-height: 1.4;
  }

  /* ── CTA ──────────────────────────────────────────────────────────── */

  .f.cta h1 { margin-bottom: 40px; }
  .cta-body {
    font-family: var(--font-body);
    font-weight: 400;
    font-size: 32px;
    line-height: 1.5;
    opacity: 0.86;
    max-width: 760px;
    margin: 0 0 56px 0;
  }
  .cta-box {
    display: inline-block;
    align-self: flex-start;
    background: var(--fg);
    color: var(--bg);
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 26px;
    letter-spacing: 0.1em;
    padding: 28px 44px;
  }
</style>
</head>
<body class="frame-quote theme-red len-mid">

  <div class="grid" aria-hidden="true"></div>
  <div class="bracket b-tl" aria-hidden="true"></div>
  <div class="bracket b-tr" aria-hidden="true"></div>
  <div class="bracket b-bl" aria-hidden="true"></div>
  <div class="bracket b-br" aria-hidden="true"></div>

  <div class="head">
    <div class="kicker">Automation</div>
    <div class="marker">03 / 06</div>
  </div>

  <main>

    <section class="f hook">
      <div class="spacer"></div>
      <div class="chips">
        <div class="chip"></div>
        <div class="chip"></div>
        <div class="chip"></div>
      </div>
      <h1></h1>
      <div class="swipe">Swipe &#8594;</div>
      <div class="spacer"></div>
    </section>

    <section class="f problem">
      <div class="spacer"></div>
      <h1></h1>
      <p class="body"></p>
      <div class="spacer"></div>
    </section>

    <section class="f stat">
      <div class="spacer"></div>
      <div class="figure"></div>
      <div class="figure-label"></div>
      <div class="source"></div>
      <div class="spacer"></div>
    </section>

    <section class="f consequence">
      <div class="spacer"></div>
      <h1></h1>
      <p class="body"></p>
      <div class="spacer"></div>
    </section>

    <section class="f stakes">
      <div class="spacer"></div>
      <h1></h1>
      <div class="worked"></div>
      <p class="body"></p>
      <div class="spacer"></div>
    </section>

    <section class="f quote">
      <div class="spacer"></div>
      <div class="qmark">&ldquo;</div>
      <p class="quote-text">Automating an inefficient process just makes you inefficient <em>faster</em></p>
      <div class="attrib">PwC · cited in the article</div>
      <div class="spacer"></div>
    </section>

    <section class="f steps">
      <div class="spacer"></div>
      <h1></h1>
      <div class="step"><div class="step-num">01</div><div class="step-text"></div></div>
      <div class="step"><div class="step-num">02</div><div class="step-text"></div></div>
      <div class="step"><div class="step-num">03</div><div class="step-text"></div></div>
      <div class="step"><div class="step-num">04</div><div class="step-text"></div></div>
      <div class="spacer"></div>
    </section>

    <section class="f actions">
      <div class="spacer"></div>
      <h1></h1>
      <div class="cards">
        <div class="card"><div class="card-num">01</div><div class="card-text"></div></div>
        <div class="card"><div class="card-num">02</div><div class="card-text"></div></div>
        <div class="card"><div class="card-num">03</div><div class="card-text"></div></div>
      </div>
      <div class="spacer"></div>
    </section>

    <section class="f cta">
      <div class="spacer"></div>
      <h1></h1>
      <p class="cta-body"></p>
      <div class="cta-box"></div>
      <div class="spacer"></div>
    </section>

  </main>

  <div class="foot">
    <div class="mark">SYSBILT</div>
  </div>

</body>
</html>
