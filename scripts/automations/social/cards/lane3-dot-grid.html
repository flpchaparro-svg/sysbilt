<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<title>B - Dot grid - SYSBILT card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    position: relative;
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
  }

  /* Themes. Explicit rgba so rendering does not depend on color-mix support. */
  .theme-cream {
    --bg: #FFF2EC;
    --ink: #1A1A1A;
    --accent: #9A1730;
    --frame-line: rgba(26, 26, 26, 0.24);
    --dot: rgba(26, 26, 26, 0.06);
  }
  .theme-dark {
    --bg: #1A1A1A;
    --ink: #FFF2EC;
    --accent: #D4A84B;
    --frame-line: rgba(255, 242, 236, 0.24);
    --dot: rgba(255, 242, 236, 0.09);
  }

  .topic {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 20px;
    text-transform: uppercase;
    letter-spacing: 0.24em;
    color: var(--ink);
    line-height: 1;
  }

  /* Base size. Length classes below override it. */
  .headline {
    font-family: 'Lora', serif;
    font-weight: 400;
    font-size: 96px;
    line-height: 1.10;
    letter-spacing: -0.01em;
    color: var(--ink);
    margin: 0;
  }
  .headline em {
    font-style: italic;
    font-weight: 400;
    color: var(--accent);
  }

  /* Headline size steps, set by character count at render time.
     len-short  under 40 chars
     len-mid    40 to 75 chars
     len-long   over 75 chars
     Sizes are a touch tighter than the first pass so LinkedIn mid-length titles breathe. */
  .len-short .headline { font-size: 110px; }
  .len-mid   .headline { font-size: 90px; }
  .len-long  .headline { font-size: 72px; }

  .takeaway {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 32px;
    line-height: 1.45;
    color: var(--ink);
    opacity: 0.78;
    margin: 0;
  }

  .card {
    position: relative;
    width: 1080px;
    height: 1350px;
  }

  /* Frame: 1px inset border, 128px from the card edge (88 safe area + 40 inset) */
  .frame {
    position: absolute;
    top: 128px;
    left: 128px;
    right: 128px;
    bottom: 128px;
    border: 1px solid var(--frame-line);
  }
  .frame-inner {
    position: absolute;
    top: 60px;
    left: 60px;
    right: 60px;
    bottom: 60px;
    display: grid;
    grid-template-rows: auto 1fr auto;
  }
  .frame-inner .headline-block {
    display: flex;
    align-items: center;
  }
  .takeaway-block:has(.takeaway:empty) { display: none; }

  /* Small corner brackets */
  .bracket {
    position: absolute;
    width: 28px;
    height: 28px;
    pointer-events: none;
  }
  .bracket::before,
  .bracket::after {
    content: '';
    position: absolute;
    background: var(--accent);
  }
  .bracket::before { width: 28px; height: 2px; }
  .bracket::after  { width: 2px;  height: 28px; }
  .bracket-tl { top: -1px; left: -1px; }
  .bracket-tl::before { top: 0; left: 0; }
  .bracket-tl::after  { top: 0; left: 0; }
  .bracket-tr { top: -1px; right: -1px; }
  .bracket-tr::before { top: 0; right: 0; }
  .bracket-tr::after  { top: 0; right: 0; }
  .bracket-bl { bottom: -1px; left: -1px; }
  .bracket-bl::before { bottom: 0; left: 0; }
  .bracket-bl::after  { bottom: 0; left: 0; }
  .bracket-br { bottom: -1px; right: -1px; }
  .bracket-br::before { bottom: 0; right: 0; }
  .bracket-br::after  { bottom: 0; right: 0; }

  .corner {
    position: absolute;
    bottom: 88px;
    right: 88px;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 17px;
    text-transform: uppercase;
    letter-spacing: 0.22em;
    color: var(--ink);
    opacity: 0.4;
    line-height: 1;
  }

  /* --- B · Dot grid texture (removable) ---
     3px dots on a 34px grid, masked strong-top / clean-headline / faint-bottom.
     Delete the <div class="texture"> in the body to return to a flat background. */
  .texture {
    position: absolute;
    top: 0;
    left: 0;
    width: 1080px;
    height: 1350px;
    z-index: -1;
    pointer-events: none;
    background-image: radial-gradient(circle at center, var(--dot) 0, var(--dot) 1.5px, transparent 1.6px);
    background-size: 34px 34px;
    -webkit-mask-image: linear-gradient(
      to bottom,
      rgba(0, 0, 0, 1) 0%,
      rgba(0, 0, 0, 1) 20%,
      rgba(0, 0, 0, 0) 42%,
      rgba(0, 0, 0, 0) 70%,
      rgba(0, 0, 0, 0.28) 92%,
      rgba(0, 0, 0, 0.28) 100%
    );
            mask-image: linear-gradient(
      to bottom,
      rgba(0, 0, 0, 1) 0%,
      rgba(0, 0, 0, 1) 20%,
      rgba(0, 0, 0, 0) 42%,
      rgba(0, 0, 0, 0) 70%,
      rgba(0, 0, 0, 0.28) 92%,
      rgba(0, 0, 0, 0.28) 100%
    );
  }
</style>
</head>
<body class="{{THEME}} {{LENGTH}}">
  <!-- texture: delete this element to return to a flat background -->
  <div class="texture" aria-hidden="true"></div>
  <div class="card">
    <div class="frame">
      <div class="bracket bracket-tl"></div>
      <div class="bracket bracket-tr"></div>
      <div class="bracket bracket-bl"></div>
      <div class="bracket bracket-br"></div>
      <div class="frame-inner">
        <div class="topic">/ {{TOPIC}}</div>
        <div class="headline-block">
          <h1 class="headline">{{HEADLINE}}</h1>
        </div>
        <div class="takeaway-block">
          <p class="takeaway">{{TAKEAWAY}}</p>
        </div>
      </div>
    </div>
  </div>
  <div class="corner">SYSBILT</div>
</body>
</html>
